syntax = "proto3";

package shieldd.execution_client.v1;

import "cosmos/base/v1beta1/coin.proto";
import "google/protobuf/timestamp.proto";
import "shieldd/cnidarium/v1/cnidarium.proto";
import "shieldd/core/asset/v1/asset.proto";
import "shieldd/core/app/v1/app.proto";
import "shieldd/core/component/compact_block/v1/compact_block.proto";
import "shieldd/core/component/sct/v1/sct.proto";
import "shieldd/core/component/compliance/v1/compliance.proto";
import "shieldd/core/component/shielded_pool/v1/shielded_pool.proto";
import "shieldd/core/keys/v1/keys.proto";

// ExecutionClientService is Bankd's typed boundary for driving its embedded
// Shieldd subsystem within the same atomic block lifecycle.
service ExecutionClientService {
  // InitGenesis initializes Shieldd state from full genesis content or a
  // checkpoint supplied by the host chain.
  rpc InitGenesis(InitGenesisRequest) returns (InitGenesisResponse) {}
  // BeginBlock opens a new Shieldd block at the host chain's block height.
  rpc BeginBlock(BeginBlockRequest) returns (BeginBlockResponse) {}
  // Deposit mints Shieldd notes for assets escrowed or burned by the host
  // chain.
  rpc Deposit(DepositRequest) returns (DepositResponse) {}
  // ApplyComplianceAction applies a Bankd-authorized user/asset status transition.
  rpc ApplyComplianceAction(ApplyComplianceActionRequest) returns (ApplyComplianceActionResponse) {}
  // SeizeNote consumes one frozen regulated note and returns the exact host
  // settlement that Bankd must apply atomically with this call.
  rpc SeizeNote(SeizeNoteRequest) returns (SeizeNoteResponse) {}
  // CheckTx validates a Shieldd transaction supplied by the host chain without
  // applying state changes.
  rpc CheckTx(CheckTxRequest) returns (CheckTxResponse) {}
  // DeliverTx applies a Shieldd transaction supplied by the host chain.
  rpc DeliverTx(DeliverTxRequest) returns (DeliverTxResponse) {}
  // EndBlock finalizes the active Shieldd block.
  rpc EndBlock(EndBlockRequest) returns (EndBlockResponse) {}
  // Commit persists the pending Shieldd state and returns the committed root.
  rpc Commit(CommitRequest) returns (CommitResponse) {}
  // GetCommittedState returns the latest state durably committed by Shieldd.
  rpc GetCommittedState(GetCommittedStateRequest) returns (GetCommittedStateResponse) {}
  // Rollback discards uncommitted Shieldd state for the current execution phase.
  rpc Rollback(RollbackRequest) returns (RollbackResponse) {}
  // ExportGenesis exports the currently committed Shieldd state as genesis.
  rpc ExportGenesis(ExportGenesisRequest) returns (ExportGenesisResponse) {}
  // ArchivedNullifierProof returns a retired-generation witness for an old note.
  rpc ArchivedNullifierProof(ArchivedNullifierProofRequest)
      returns (ArchivedNullifierProofResponse) {}
  // NullifierWindow returns the committed nullifier-generation planning window.
  rpc NullifierWindow(NullifierWindowRequest) returns (NullifierWindowResponse) {}
  // AppParameters returns the committed Shieldd application parameters.
  rpc AppParameters(AppParametersRequest) returns (AppParametersResponse) {}
  // AssetMetadataById returns metadata for one Shieldd asset identifier.
  rpc AssetMetadataById(AssetMetadataByIdRequest) returns (AssetMetadataByIdResponse) {}
  // ComplianceAssetStatus returns the registered policy for one Shieldd asset.
  rpc ComplianceAssetStatus(ComplianceAssetStatusRequest)
      returns (ComplianceAssetStatusResponse) {}
  // ComplianceBatchMerkleProofs returns the compliance witnesses needed by transaction planning.
  rpc ComplianceBatchMerkleProofs(ComplianceBatchMerkleProofsRequest)
      returns (ComplianceBatchMerkleProofsResponse) {}
  // ComplianceUserLeaf returns one registered user-asset compliance leaf.
  rpc ComplianceUserLeaf(ComplianceUserLeafRequest) returns (ComplianceUserLeafResponse) {}
  // KeyValue returns committed verifiable Shieldd state.
  rpc KeyValue(KeyValueRequest) returns (KeyValueResponse) {}
  // CompactBlockRange streams a bounded committed compact-block range.
  rpc CompactBlockRange(CompactBlockRangeRequest)
      returns (stream CompactBlockRangeResponse) {}
}

// ArchivedNullifierProofRequest carries the component query across the host-chain boundary.
message ArchivedNullifierProofRequest {
  shieldd.core.component.sct.v1.ArchivedNullifierProofRequest request = 1;
}

// ArchivedNullifierProofResponse carries the component result across the host-chain boundary.
message ArchivedNullifierProofResponse {
  shieldd.core.component.sct.v1.ArchivedNullifierProofResponse response = 1;
}

message NullifierWindowRequest {
  shieldd.core.component.sct.v1.NullifierWindowRequest request = 1;
}

message NullifierWindowResponse {
  shieldd.core.component.sct.v1.NullifierWindowResponse response = 1;
}

message AppParametersRequest {
  shieldd.core.app.v1.AppParametersRequest request = 1;
}

message AppParametersResponse {
  shieldd.core.app.v1.AppParametersResponse response = 1;
}

message AssetMetadataByIdRequest {
  shieldd.core.component.shielded_pool.v1.AssetMetadataByIdRequest request = 1;
}

message AssetMetadataByIdResponse {
  shieldd.core.component.shielded_pool.v1.AssetMetadataByIdResponse response = 1;
}

message ComplianceAssetStatusRequest {
  shieldd.core.component.compliance.v1.ComplianceAssetStatusRequest request = 1;
}

message ComplianceAssetStatusResponse {
  shieldd.core.component.compliance.v1.ComplianceAssetStatusResponse response = 1;
}

message ComplianceBatchMerkleProofsRequest {
  shieldd.core.component.compliance.v1.ComplianceBatchMerkleProofsRequest request = 1;
}

message ComplianceBatchMerkleProofsResponse {
  shieldd.core.component.compliance.v1.ComplianceBatchMerkleProofsResponse response = 1;
}

message ComplianceUserLeafRequest {
  shieldd.core.component.compliance.v1.ComplianceUserLeafRequest request = 1;
}

message ComplianceUserLeafResponse {
  shieldd.core.component.compliance.v1.ComplianceUserLeafResponse response = 1;
}

message KeyValueRequest {
  shieldd.cnidarium.v1.KeyValueRequest request = 1;
}

message KeyValueResponse {
  shieldd.cnidarium.v1.KeyValueResponse response = 1;
}

message CompactBlockRangeRequest {
  shieldd.core.component.compact_block.v1.CompactBlockRangeRequest request = 1;
}

message CompactBlockRangeResponse {
  shieldd.core.component.compact_block.v1.CompactBlockRangeResponse response = 1;
}

// InitGenesisRequest carries the Shieldd genesis payload controlled by the host
// chain.
message InitGenesisRequest {
  // Genesis state to initialize, either full content or a checkpoint.
  shieldd.core.app.v1.GenesisAppState genesis = 1;
}

// InitGenesisResponse is empty on success.
message InitGenesisResponse {
}

// BeginBlockRequest carries the host-chain block fields Shieldd uses during
// begin-block execution.
message BeginBlockRequest {
  // Host-chain block height.
  int64 height = 1;
  // Host-chain block time.
  google.protobuf.Timestamp time = 2;
}

// BeginBlockResponse contains non-consensus events emitted by Shieldd.
message BeginBlockResponse {
  // Events emitted during begin-block execution.
  repeated Event events = 1;
}

// DepositRequest describes a host-chain deposit that should mint a Shieldd note.
message DepositRequest {
  // Host-chain asset denomination.
  string denom = 1;
  // Base-unit amount encoded as a decimal string.
  string amount = 2;
  // Shieldd recipient address.
  string recipient = 3;
  // Host-chain source used for replay protection and deposit identity.
  HostSource source = 4;
}

// HostSource identifies the canonical Bankd message that caused a Shieldd mutation.
message HostSource {
  // Host-chain block height containing the deposit message.
  uint64 height = 1;
  // Host-chain transaction hash containing the deposit message.
  bytes tx_hash = 2;
  // Zero-based message index within the host-chain transaction.
  uint32 msg_index = 3;
  // Zero-based transaction index within the host-chain block.
  uint32 tx_index = 4;
}

// DepositResponse returns the deterministic Shieldd deposit identifier.
message DepositResponse {
  // Deposit identifier used as the Shieldd commitment source transaction id.
  bytes deposit_id = 1;
}

message FreezeUserAsset {
  shieldd.core.keys.v1.Address address = 1;
  shieldd.core.asset.v1.AssetId asset_id = 2;
}

message UnfreezeUserAsset {
  shieldd.core.keys.v1.Address address = 1;
  shieldd.core.asset.v1.AssetId asset_id = 2;
}

message ApplyComplianceActionRequest {
  HostSource source = 1;
  oneof action {
    FreezeUserAsset freeze = 2;
    UnfreezeUserAsset unfreeze = 3;
  }
}

message ApplyComplianceActionResponse {
  HostSource source = 1;
  shieldd.core.component.compliance.v1.UserAssetStatus previous_status = 2;
  shieldd.core.component.compliance.v1.UserAssetStatus current_status = 3;
  bool replayed = 4;
  // Monotonic generation of the latest freeze for this address and asset.
  uint64 freeze_generation = 5;
}

message SeizeNoteRequest {
  HostSource source = 1;
  shieldd.core.component.shielded_pool.v1.NoteSeizure seizure = 2;
}

message SeizeNoteResponse {
  HostSource source = 1;
  bool replayed = 2;
  HostWithdrawal withdrawal = 3;
  shieldd.core.component.compliance.v1.UserAssetStatus current_status = 4;
  uint64 freeze_generation = 5;
}

// CheckTxRequest carries a Shieldd transaction to validate without applying
// state changes.
message CheckTxRequest {
  // Raw Shieldd transaction bytes.
  bytes tx = 1;
}

// CheckTxResponse contains the Shieldd transaction admission result.
message CheckTxResponse {
  // Non-zero when Shieldd rejected the transaction.
  uint32 code = 1;
  // Response data emitted by the transaction.
  bytes data = 2;
  // Human-readable validation log.
  string log = 3;
  // Additional validation information.
  string info = 4;
  // Gas requested by the transaction.
  int64 gas_wanted = 5;
  // Gas consumed by validation.
  int64 gas_used = 6;
  // Events emitted during transaction validation.
  repeated Event events = 7;
  // Module or subsystem that produced a non-zero code.
  string codespace = 8;
}

// DeliverTxRequest carries a Shieldd transaction supplied by the host chain.
message DeliverTxRequest {
  // Raw Shieldd transaction bytes.
  bytes tx = 1;
}

// DeliverTxResponse contains the Shieldd transaction execution result.
message DeliverTxResponse {
  // Non-zero when Shieldd rejected the transaction.
  uint32 code = 1;
  // Response data emitted by the transaction.
  bytes data = 2;
  // Human-readable execution log.
  string log = 3;
  // Additional execution information.
  string info = 4;
  // Gas requested by the transaction.
  int64 gas_wanted = 5;
  // Gas consumed by the transaction.
  int64 gas_used = 6;
  // Events emitted during transaction execution.
  repeated Event events = 7;
  // Module or subsystem that produced a non-zero code.
  string codespace = 8;
  // Host-chain withdrawals in their order within the executed transaction.
  repeated HostWithdrawal withdrawals = 9;
}

// HostWithdrawal describes committed value the host chain must transfer or execute.
message HostWithdrawal {
  // Coin withdrawn from Shieldd.
  cosmos.base.v1beta1.Coin coin = 1;
  oneof destination {
    shieldd.core.component.shielded_pool.v1.HostTransfer transfer = 2;
    shieldd.core.component.shielded_pool.v1.HostExecution execution = 3;
  }
}

// EndBlockRequest identifies the host-chain block being finalized.
message EndBlockRequest {
  // Host-chain block height.
  int64 height = 1;
}

// EndBlockResponse contains non-consensus events emitted by Shieldd.
message EndBlockResponse {
  // Events emitted during end-block execution.
  repeated Event events = 1;
}

// Event describes a non-consensus execution event emitted by Shieldd.
message Event {
  // Event type.
  string type = 1;
  // Event attributes.
  repeated EventAttribute attributes = 2;
}

// EventAttribute is a key-value pair attached to a Shieldd execution event.
message EventAttribute {
  // Attribute key.
  string key = 1;
  // Attribute value.
  string value = 2;
  // Whether host-chain indexers should index this attribute.
  bool index = 3;
}

// CommitRequest is empty because all pending state is held by the execution
// client.
message CommitRequest {}

// CommitResponse contains the root hash committed by Shieldd.
message CommitResponse {
  // Committed Shieldd application root hash.
  bytes root_hash = 1;
}

// GetCommittedStateRequest is empty because Shieldd always returns its latest
// durable state.
message GetCommittedStateRequest {}

// GetCommittedStateResponse identifies the latest durable Shieldd state.
message GetCommittedStateResponse {
  // Host-chain block height stored in the committed Shieldd state.
  uint64 height = 1;
  // Committed Shieldd application root hash.
  bytes root_hash = 2;
}

// RollbackRequest is empty because rollback applies to the current pending
// execution phase.
message RollbackRequest {}

// RollbackResponse is empty on success.
message RollbackResponse {}

// ExportGenesisRequest is empty because it exports the latest committed state.
message ExportGenesisRequest {}

// ExportGenesisResponse returns the exported Shieldd genesis payload.
message ExportGenesisResponse {
  // Exported Shieldd genesis state.
  shieldd.core.app.v1.GenesisAppState genesis = 1;
}
