syntax = "proto3";
package shieldd.core.component.shielded_pool.v1;

import "shieldd/core/asset/v1/asset.proto";
import "shieldd/core/component/compliance/v1/compliance.proto";
import "shieldd/core/component/sct/v1/sct.proto";
import "shieldd/core/keys/v1/keys.proto";
import "shieldd/core/num/v1/num.proto";
import "shieldd/crypto/decaf377_rdsa/v1/decaf377_rdsa.proto";
import "shieldd/crypto/tct/v1/tct.proto";

// Configuration data for the shielded pool component.
message ShieldedPoolParameters {
  DiscoveryParameters discovery_params = 1;
  uint64 discovery_grace_period_blocks = 2;
}

// Genesis data for the shielded pool component.
message GenesisContent {
  ShieldedPoolParameters shielded_pool_params = 1;
  message Allocation {
    shieldd.core.num.v1.Amount amount = 1;
    string denom = 2;
    shieldd.core.keys.v1.Address address = 3;
  }

  // The allocations present at genesis
  repeated Allocation allocations = 3;
}

// Protocol-controlled precision for public note-discovery tags.
message DiscoveryParameters {
  uint32 regulated_precision_bits = 1;
  uint32 unregulated_precision_bits = 2;
  uint64 as_of_height = 3;
}

// Fixed-width public routing value. Precision is deliberately not encoded.
message RoutingTag {
  fixed32 value = 1;
}

// Local or query-side matcher for routing tags.
message RoutingSelector {
  uint32 precision_bits = 1;
  fixed32 prefix = 2;
}

// Fixed public routing shape for a transfer action.
message TransferRouting {
  repeated RoutingTag tags = 1;
}

message Note {
  asset.v1.Value value = 1;
  bytes rseed = 2;
  keys.v1.Address address = 3;
  // Commitment to the recovery capsule that can spend this exact note under seizure.
  bytes recovery_commitment = 4;
}

message NoteView {
  asset.v1.ValueView value = 1;
  bytes rseed = 2;
  keys.v1.AddressView address = 3;
  bytes recovery_commitment = 4;
}

// An encrypted note.
// 176 = 48(address) + 16(amount) + 32(asset ID) + 32(rseed)
//     + 32(recovery commitment) + 16(MAC) bytes.
message NoteCiphertext {
  bytes inner = 1;
}

// Fixed-shape capability ciphertext for amount and note blinding.
message RecoveryCapsule {
  // Canonical 192-byte encoding of epk and five Fq words.
  bytes inner = 1;
}

// The body of an output description, including only the minimal
// data required to scan and process the output.
message NotePayload {
  // The note commitment for the output note. 32 bytes.
  crypto.tct.v1.StateCommitment note_commitment = 1;
  // The encoding of an ephemeral public key. 32 bytes.
  bytes ephemeral_key = 2;
  // An encryption of the newly created note.
  // 176-byte authenticated encryption of the newly created note.
  NoteCiphertext encrypted_note = 3;
  // Public recovery sidecar authenticated by note_commitment.
  RecoveryCapsule recovery_capsule = 4;
}

// A Shieldd ZK transfer proof.
message ZKTransferProof {
  bytes inner = 1;
}

// A Shieldd ZK note reshape proof.
message ZKNoteReshapeProof {
  bytes inner = 1;
}

// A Shieldd ZK shielded withdrawal proof.
message ZKShieldedWithdrawalProof {
  bytes inner = 1;
}

// A proof that one real note is consumed with its canonical compliance nullifier.
message ZKNoteSeizureProof {
  bytes inner = 1;
}

// Immutable facts signed by the asset's seizure authority.
message NoteSeizureAuthorizationBody {
  reserved 10;

  string chain_id = 1;
  crypto.tct.v1.StateCommitment note_commitment = 2;
  sct.v1.Nullifier nullifier = 3;
  keys.v1.Address address = 4;
  asset.v1.AssetId asset_id = 5;
  num.v1.Amount amount = 6;
  uint64 freeze_generation = 7;
  uint64 frozen_since_height = 8;
  HostWithdrawal withdrawal = 9;
  uint64 expiry_height = 11;
}

// Canonical metadata for a future ACP-gated release of one recovery capsule.
message CapsuleReleaseRequest {
  string chain_id = 1;
  string ring_id = 2;
  string policy_id = 3;
  string permission = 4;
  string resource = 5;
  bytes ring_pk = 6;
  asset.v1.AssetId asset_id = 7;
  keys.v1.Address address = 8;
  bytes capk = 9;
  crypto.tct.v1.StateCommitment note_commitment = 10;
  bytes recovery_commitment = 11;
  bytes capsule_epk = 12;
  bytes authority_instruction_commitment = 13;
  uint64 expiry_height = 14;
}

// A capsule-specific point and proof returned by a future Orbis release API.
message CapsuleReleaseEvidence {
  bytes release_id = 1;
  bytes recovered_point = 2;
  compliance.v1.DleqProof proof = 3;
}

// Complete evidence needed to seize one note. It is submitted through the
// privileged host execution boundary rather than as a user transaction.
message NoteSeizure {
  reserved 7, 9, 10, 11;

  NoteSeizureAuthorizationBody authorization = 1;
  crypto.decaf377_rdsa.v1.SpendAuthSignature authority_signature = 2;
  crypto.tct.v1.MerkleRoot anchor = 3;
  bool history_required = 4;
  uint64 recent_position_floor = 5;
  RecoveryCapsule recovery_capsule = 6;
  bytes rnk_commitment = 8;
  ZKNoteSeizureProof proof = 12;
  sct.v1.NullifierWindow nullifier_window = 13;
  sct.v1.HistoricalNullifierProof historical_nullifier_proof = 14;
  CapsuleReleaseEvidence capsule_release = 15;
}

message TransferInputBody {
  // The nullifier of the spent note.
  sct.v1.Nullifier nullifier = 1;
  // The randomized validating key for the spend authorization signature.
  crypto.decaf377_rdsa.v1.SpendVerificationKey rk = 2;
  // An encryption of the commitment of the input note to the sender's OVK.
  bytes encrypted_backref = 3;
  // Compliance ciphertext encrypting spent note details for the asset issuer.
  bytes compliance_ciphertext = 4;
  // Whether this real input must carry a complete retired-history proof.
  bool history_required = 5;
}

message TransferOutputBody {
  // The minimal data required to scan and process the created note.
  NotePayload note_payload = 1;
  // An encrypted key for decrypting the memo.
  bytes wrapped_memo_key = 2;
  // The key material used for note encryption, wrapped to the sender's OVK.
  bytes ovk_wrapped_key = 3;
  // Compliance ciphertext encrypting created note details for the asset issuer.
  bytes compliance_ciphertext = 4;
  // Canonical 264-byte factored circuit metadata for the receiver output only.
  // This field must never contain DH shared points or seed-opening material.
  bytes compliance_metadata = 5;
}

// Transfers shielded notes into new shielded notes as a single action.
message Transfer {
  // The effecting data of the transfer.
  TransferBody body = 1;
  // The authorizing signatures for each transfer input.
  repeated crypto.decaf377_rdsa.v1.SpendAuthSignature auth_sigs = 2;
  // The proof that the transfer is well-formed.
  ZKTransferProof proof = 3;
}

// The body of a fused shielded transfer.
message TransferBody {
  // The state commitment tree anchor used during proof generation.
  crypto.tct.v1.MerkleRoot anchor = 15;
  // A commitment to the net balance of the action.
  asset.v1.BalanceCommitment balance_commitment = 1;
  // The transfer inputs.
  repeated TransferInputBody inputs = 2;
  // The transfer outputs.
  repeated TransferOutputBody outputs = 3;
  // Target timestamp for compliance verification (Unix UTC seconds).
  uint64 target_timestamp = 4;
  // Compliance tree anchor (user tree root) used during proof generation.
  crypto.tct.v1.StateCommitment compliance_anchor = 5;
  // Asset tree anchor used during proof generation.
  crypto.tct.v1.StateCommitment asset_anchor = 6;
  // Fixed sender/receiver routing-tag bundle.
  TransferRouting routing = 7;
  // Poseidon identifier of the privately selected protocol parameter set.
  bytes routing_parameter_set_id = 8;
  // Fixed-shape daily undisclosed-volume accumulator payload.
  VolumeAccumulatorPayload volume_accumulator = 9;
  // Public circuit context preventing fee funding from advancing an accumulator.
  TransferProofContext proof_context = 10;
}

enum TransferProofContext {
  TRANSFER_PROOF_CONTEXT_UNSPECIFIED = 0;
  TRANSFER_PROOF_CONTEXT_ORDINARY = 1;
  TRANSFER_PROOF_CONTEXT_FEE_FUNDING = 2;
}

// Public transition material for one daily undisclosed-volume accumulator slot.
message VolumeAccumulatorPayload {
  sct.v1.Nullifier nullifier = 1;
  crypto.tct.v1.StateCommitment commitment = 2;
  // OVK-encrypted fixed-width accumulator state (92-byte plaintext plus AEAD tag).
  bytes encrypted_state = 3;
  // UTC day start in Unix seconds. Used only to scope temporary nullifier storage.
  uint64 day_start = 4;
}

// Private planning state for the fixed accumulator slot.
message VolumeAccumulatorPlan {
  bool use_real = 1;
  bool starts_new_day = 2;
  uint64 day_start = 3;
  bytes subject = 4;
  bytes prior_volume = 5;
  bytes prior_blinding = 6;
  crypto.tct.v1.StateCommitment prior_commitment = 7;
  uint64 prior_position = 8;
  bytes successor_volume = 9;
  bytes successor_blinding = 10;
}

message TransferView {
  message Visible {
    Transfer transfer = 1;
    repeated NoteView spent_notes = 2;
    repeated NoteView created_notes = 3;
    keys.v1.PayloadKey payload_key = 4;
  }

  message Opaque {
    Transfer transfer = 1;
  }

  oneof transfer_view {
    Visible visible = 1;
    Opaque opaque = 2;
  }
}

message TransferPlan {
  reserved 1, 3;

  // The blinding factor to use for the net balance commitment.
  bytes value_blinding = 2;
  // The shielded input plans fused into this transfer.
  repeated ShieldedInputPlan spends = 4;
  // The shielded output plans fused into this transfer.
  repeated ShieldedOutputPlan outputs = 5;
  // Protocol routing parameter set used to construct and prove the action.
  DiscoveryParameters routing_parameters = 6;
  TransferContext compliance = 7;
  VolumeAccumulatorPlan volume_accumulator = 8;
  TransferProofContext proof_context = 9;
}

// Releases shielded value for transfer or execution on the host chain.
message HostWithdrawal {
  // The canonical Shieldd value to release.
  asset.v1.Value value = 1;
  oneof destination {
    HostTransfer transfer = 2;
    HostExecution execution = 3;
  }
}

// Transfers withdrawn value directly to a host-chain recipient.
message HostTransfer {
  string recipient = 1;
}

// Executes an ordered, atomic host-chain call batch.
message HostExecution {
  // Shieldd address credited if host execution fails.
  string refund_address = 1;
  // Maximum host-chain gas available to the call batch.
  uint64 gas_limit = 2;
  // Calls executed in order from the withdrawal's derived executor.
  repeated EvmCall calls = 3;
}

// A host-chain EVM call.
message EvmCall {
  // The 20-byte EVM contract address.
  bytes contract = 1;
  bytes calldata = 2;
}

// Withdraws shielded funds to the host chain while keeping shielded change in the same action.
message ShieldedHostWithdrawal {
  // The effecting data of the withdrawal.
  ShieldedHostWithdrawalBody body = 1;
  // The authorizing signatures for each consumed input.
  repeated crypto.decaf377_rdsa.v1.SpendAuthSignature auth_sigs = 2;
  // The proof that the withdrawal is well-formed.
  ZKShieldedWithdrawalProof proof = 3;
}

message ShieldedHostWithdrawalBody {
  // The proving family this action uses.
  uint32 family_id = 1;
  // The state commitment tree anchor used during proof generation.
  crypto.tct.v1.MerkleRoot anchor = 2;
  // A commitment to the net balance of the action.
  asset.v1.BalanceCommitment balance_commitment = 3;
  // The consumed notes.
  repeated TransferInputBody inputs = 4;
  // The embedded host-chain withdrawal payload.
  HostWithdrawal withdrawal = 5;
  // The sender-owned change note or sender-owned zero-value dummy.
  ShieldedWithdrawalChangeBody change_output = 6;
  // Target timestamp for compliance verification (Unix UTC seconds).
  uint64 target_timestamp = 7;
  // Compliance tree anchor (user tree root) used during proof generation.
  crypto.tct.v1.StateCommitment compliance_anchor = 8;
  // Asset tree anchor used during proof generation.
  crypto.tct.v1.StateCommitment asset_anchor = 9;
  // Sender routing tag, present even when the change output is dummy.
  RoutingTag routing_tag = 10;
  // Poseidon identifier of the privately selected protocol parameter set.
  bytes routing_parameter_set_id = 11;
  // Proof-bound encryption of the exact sender compliance address.
  bytes withdrawal_compliance_ciphertext = 12;
  VolumeAccumulatorPayload volume_accumulator = 14;
}

message ShieldedHostWithdrawalView {
  message Visible {
    ShieldedHostWithdrawal withdrawal = 1;
    repeated NoteView spent_notes = 2;
    NoteView change_note = 3;
    keys.v1.PayloadKey payload_key = 4;
  }

  message Opaque {
    ShieldedHostWithdrawal withdrawal = 1;
  }

  oneof shielded_host_withdrawal_view {
    Visible visible = 1;
    Opaque opaque = 2;
  }
}

message ShieldedHostWithdrawalPlan {
  reserved 1, 3;

  // The blinding factor to use for the net balance commitment.
  bytes value_blinding = 2;
  // The shielded input plans fused into this withdrawal.
  repeated ShieldedInputPlan spends = 4;
  // The sender-owned change output, if any.
  ShieldedOutputPlan change_output = 5;
  // The embedded host-chain withdrawal payload.
  HostWithdrawal withdrawal = 6;
  // Protocol-wide routing parameters bound by the reused withdrawal proof.
  DiscoveryParameters routing_parameters = 7;
  WithdrawalContext compliance = 8;
  VolumeAccumulatorPlan volume_accumulator = 9;
}

message ShieldedWithdrawalChangeBody {
  // The minimal data required to scan and process the created change note.
  NotePayload note_payload = 1;
  // An encrypted key for decrypting the memo.
  bytes wrapped_memo_key = 2;
  // The key material used for note encryption, wrapped to the sender's OVK.
  bytes ovk_wrapped_key = 3;
}

message NoteReshapeInputBody {
  // The nullifier of the spent note.
  sct.v1.Nullifier nullifier = 1;
  // The randomized validating key for the spend authorization signature.
  crypto.decaf377_rdsa.v1.SpendVerificationKey rk = 2;
  // An encryption of the commitment of the input note to the sender's OVK.
  bytes encrypted_backref = 3;
  // Whether this real input must carry a complete retired-history proof.
  bool history_required = 4;
}

message NoteReshapeOutputBody {
  // The minimal data required to scan and process the created note.
  NotePayload note_payload = 1;
  // An encrypted key for decrypting the memo.
  bytes wrapped_memo_key = 2;
  // The key material used for note encryption, wrapped to the sender's OVK.
  bytes ovk_wrapped_key = 3;
}

// Reshapes notes owned by one address without changing their total value.
message NoteReshape {
  // The effecting data of the note reshape action.
  NoteReshapeBody body = 1;
  // The authorizing signatures for each consumed input.
  repeated crypto.decaf377_rdsa.v1.SpendAuthSignature auth_sigs = 2;
  // The proof that the note reshape action is well-formed.
  ZKNoteReshapeProof proof = 3;
}

message NoteReshapeBody {
  // The proving family this action uses.
  uint32 family_id = 1;
  // The state commitment tree anchor used during proof generation.
  crypto.tct.v1.MerkleRoot anchor = 2;
  // A commitment to the net balance of the action.
  asset.v1.BalanceCommitment balance_commitment = 3;
  // The consumed notes.
  repeated NoteReshapeInputBody inputs = 4;
  // The created notes.
  repeated NoteReshapeOutputBody outputs = 5;
  // Owner routing tag for this action.
  RoutingTag routing_tag = 6;
  // Poseidon identifier of the privately selected protocol parameter set.
  bytes routing_parameter_set_id = 7;
  // Asset-registry root binding the private class-dependent routing precision.
  crypto.tct.v1.StateCommitment asset_anchor = 8;
  // Current compliance user-tree root binding the owner status for regulated assets.
  crypto.tct.v1.StateCommitment compliance_anchor = 9;
}

message NoteReshapeView {
  message Visible {
    NoteReshape note_reshape = 1;
    repeated NoteView spent_notes = 2;
    repeated NoteView created_notes = 3;
    keys.v1.PayloadKey payload_key = 4;
  }

  message Opaque {
    NoteReshape note_reshape = 1;
  }

  oneof note_reshape_view {
    Visible visible = 1;
    Opaque opaque = 2;
  }
}

message NoteReshapePlan {
  reserved 1, 3;

  // The blinding factor to use for the net balance commitment.
  bytes value_blinding = 2;
  // The shielded input plans fused into this reshape.
  repeated ShieldedInputPlan spends = 4;
  // The shielded output plans fused into this reshape.
  repeated ShieldedOutputPlan outputs = 5;
  // The deployed proving family selected for this reshape.
  uint32 family_id = 6;
  // Protocol routing parameter set used to construct and prove the action.
  DiscoveryParameters routing_parameters = 7;
  NoteReshapeContext compliance = 8;
}

// ABCI Event recording a spent nullifier.
message EventNullifierSpent {
  core.component.sct.v1.Nullifier nullifier = 1;
}

// ABCI Event recording a created note commitment.
message EventNoteCreated {
  crypto.tct.v1.StateCommitment note_commitment = 1;
}

message ShieldedInputPlan {
  Note note = 1;
  uint64 position = 2;
  bytes randomizer = 3;
  bytes value_blinding = 4;
}

message ShieldedOutputPlan {
  asset.v1.Value value = 1;
  keys.v1.Address dest_address = 2;
  bytes rseed = 3;
  bytes value_blinding = 4;
}

// Query operations for the shielded pool component.
service QueryService {
  rpc AssetMetadataById(AssetMetadataByIdRequest) returns (AssetMetadataByIdResponse);

  // Requests a stream of asset metadata, given an array of asset IDs. Responses
  // may be streamed in a different order from that of the asset IDs in the
  // request, and asset IDs unknown to the node will not receive any response
  // objects -- that is, the number of responses may be smaller than the length
  // of the asset IDs array.
  rpc AssetMetadataByIds(AssetMetadataByIdsRequest) returns (stream AssetMetadataByIdsResponse);
}

// Requests information on an asset by asset id
message AssetMetadataByIdRequest {
  // The asset id to request information on.
  core.asset.v1.AssetId asset_id = 2;
}

message AssetMetadataByIdResponse {
  // If present, information on the requested asset.
  //
  // If the requested asset was unknown, this field will not be present.
  core.asset.v1.Metadata denom_metadata = 1;
}

// Requests information on an asset by multiple asset ids
message AssetMetadataByIdsRequest {
  // The asset IDs to request information on. Note that node is neither required
  // nor expected to stream responses in the same order as this array.
  repeated core.asset.v1.AssetId asset_id = 1;
}

message AssetMetadataByIdsResponse {
  // A single asset metadata streamed from the node.
  core.asset.v1.Metadata denom_metadata = 1;
}

// Metadata about the packet associated with the transfer.
//
// This allows identifying which specific packet is associated with the transfer.
// Implicitly, both ports are going to be "transfer".
message FungibleTokenTransferPacketMetadata {
  // The identifier for the channel on *this* chain.
  string channel = 1;
  // Sequence number for the packet.
  uint64 sequence = 2;
}

message EventOutboundFungibleTokenTransfer {
  // The value being transferred out of the chain.
  core.asset.v1.Value value = 1;
  // The sending address on chain.
  core.keys.v1.Address sender = 2;
  // The receiving address, which we don't assume anything about.
  string receiver = 3;
  FungibleTokenTransferPacketMetadata meta = 4;
}

message EventOutboundFungibleTokenRefund {
  enum Reason {
    // No particular reason.
    REASON_UNSPECIFIED = 0;
    // The transfer timed out.
    REASON_TIMEOUT = 1;
    // The transfer was acknowledged with an error.
    REASON_ERROR = 2;
  }

  // The value being refunded.
  core.asset.v1.Value value = 1;
  // The sender being refunded.
  core.keys.v1.Address sender = 2;
  // The address that attempted to receive the funds.
  string receiver = 3;
  // Why the refund is happening.
  Reason reason = 4;
  // This will be the metadata for the packet for the transfer being refunded.
  //
  // This allows linking a refund to the transfer.
  FungibleTokenTransferPacketMetadata meta = 5;
}

message EventInboundFungibleTokenTransfer {
  // The value being transferred in.
  core.asset.v1.Value value = 1;
  // The sender on the counterparty chain.
  string sender = 2;
  // The receiver on this chain.
  core.keys.v1.Address receiver = 3;
  FungibleTokenTransferPacketMetadata meta = 4;
}

message AssetWitness {
  asset.v1.AssetId asset_id = 1;
  crypto.tct.v1.StateCommitment root = 2;
  compliance.v1.IndexedLeafData leaf = 3;
  uint64 position = 4;
  compliance.v1.MerklePath path = 5;
  bool is_regulated = 6;
}

message UserWitness {
  compliance.v1.ComplianceLeaf leaf = 1;
  uint64 position = 2;
  compliance.v1.MerklePath path = 3;
}

message ActionWitness {
  AssetWitness asset = 1;
  crypto.tct.v1.StateCommitment user_root = 2;
  UserWitness sender = 3;
  compliance.v1.AssetPolicy policy = 4;
}

message TransferContext {
  ActionWitness witness = 1;
  UserWitness recipient = 2;
  uint64 timestamp = 4;
  bytes nonce = 5;
}

message NoteReshapeContext {
  ActionWitness witness = 1;
  bytes nonce = 2;
}

message WithdrawalContext {
  ActionWitness witness = 1;
  uint64 timestamp = 2;
  bytes nonce = 3;
}
