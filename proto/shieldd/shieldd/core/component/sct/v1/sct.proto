syntax = "proto3";
package shieldd.core.component.sct.v1;

import "shieldd/crypto/tct/v1/tct.proto";
import "google/protobuf/timestamp.proto";
import "ibc/core/commitment/v1/commitment.proto";

// Configuration data for the SCT component.
message SctParameters {
  // The default duration of each epoch, in number of blocks.
  uint64 epoch_duration = 1;
  // Number of recent SCT anchors and historical timestamps retained for witness refresh.
  uint64 sct_anchor_retention_blocks = 2;
}

// Sct-specific genesis content.
message GenesisContent {
  // The SctParameters present at genesis.
  SctParameters sct_params = 1;
}

// An epoch is a sequentially numbered collection of contiguous blocks.
message Epoch {
  // The unique index of the epoch.
  uint64 index = 1;
  // The starting height for the epoch.
  uint64 start_height = 2;
}

// Metadata describing the source of a commitment in the state commitment tree.
//
// This message allows clients to track provenance of state commitments, and to
// decide whether or not to download block data.
message CommitmentSource {
  reserved 2;
  // The state commitment was included in the genesis state.
  message Genesis {}
  // The commitment was created by a transaction.
  //
  // When included in a `CompactBlock` via a `StatePayload`, the transaction source is "dehydrated"
  // by stripping the `id` field and putting empty bytes in its place.  When clients perform extended
  // transaction fetch, they should match up transaction hashes to "rehydrate" the source info.
  message Transaction {
    // The transaction ID, if specified.
    //
    // This field may be omitted to save space, and should not be required to be present.
    // If the bytes are missing, the message should be interpreted as "Transaction (Unknown)".
    bytes id = 1;
  }
  // The commitment was created by an inbound ICS20 transfer.

  oneof source {
    Transaction transaction = 1;
    Genesis genesis = 40;
  }
}

message Nullifier {
  bytes inner = 1;
}

// Canonical storage identity for a Poseidon indexed nullifier generation tree.
message NullifierTreeId {
  uint64 generation = 1;
}

// Consensus state for the two active nullifier generations and retired history.
message NullifierGenerationState {
  uint32 protocol_version = 1;
  uint64 activation_epoch = 2;
  uint64 current_generation = 3;
  NullifierTreeId current_tree = 4;
  bytes current_root = 5;
  uint64 current_start_position = 6;
  NullifierTreeId previous_tree = 7;
  bytes previous_root = 8;
  uint64 recent_position_floor = 9;
  uint64 archived_generation_count = 10;
  bytes archived_history_head = 11;
}

// Public transaction projection of nullifier generation state.
message NullifierWindow {
  uint32 protocol_version = 1;
  uint64 current_generation = 2;
  uint64 recent_position_floor = 3;
  uint64 archived_generation_count = 4;
  bytes archived_history_head = 5;
}

// One BLS12-377 proof of nonmembership in a retired generation.
message GenerationNonmembershipProof {
  uint64 generation_index = 1;
  bytes generation_root = 2;
  uint64 generation_start_position = 3;
  uint64 generation_end_position = 4;
  bytes groth16_proof = 5;
}

// One BW6-761 proof covering a canonical fixed-width history chunk.
message HistoricalChunkProof {
  uint64 chunk_index = 1;
  bytes end_history_head = 2;
  bytes groth16_proof = 3;
}

// Complete retired-prefix proof for one public nullifier.
message HistoricalNullifierProof {
  Nullifier nullifier = 1;
  repeated HistoricalChunkProof completed_chunks = 2;
  repeated GenerationNonmembershipProof tail = 3;
}

// Event recording a new commitment added to the SCT.
message EventCommitment {
  crypto.tct.v1.StateCommitment commitment = 1;
  uint64 position = 2;
  CommitmentSource source = 3;
}

// Event recording an SCT anchor (global root).
message EventAnchor {
  crypto.tct.v1.MerkleRoot anchor = 1;
  uint64 height = 2;
  google.protobuf.Timestamp timestamp = 3;
}

// Event recording an SCT epoch root.
message EventEpochRoot {
  crypto.tct.v1.MerkleRoot root = 1;
  uint64 index = 2;
  google.protobuf.Timestamp timestamp = 3;
}

// Event recording an SCT block root.
message EventBlockRoot {
  crypto.tct.v1.MerkleRoot root = 1;
  uint64 height = 2;
  google.protobuf.Timestamp timestamp = 3;
}

// Event emitted when the current generation becomes the retained previous tree.
message EventNullifierGenerationFrozen {
  uint64 generation_index = 1;
  uint64 application_epoch_start = 2;
  uint64 application_epoch_end = 3;
  uint64 generation_start_position = 4;
  uint64 generation_end_position = 5;
  bytes generation_root = 6;
}

// Event emitted when the previous generation enters the committed retired history.
message EventNullifierGenerationArchived {
  uint64 generation_index = 1;
  uint64 generation_start_position = 2;
  uint64 generation_end_position = 3;
  bytes generation_root = 4;
  uint64 archived_generation_count = 5;
  bytes archived_history_head = 6;
}

message EpochByHeightRequest {
  uint64 height = 1;
}

message EpochByHeightResponse {
  Epoch epoch = 1;
}

message AnchorByHeightRequest {
  uint64 height = 1;
}

message AnchorByHeightResponse {
  crypto.tct.v1.MerkleRoot anchor = 1;
}

message TimestampByHeightRequest {
  uint64 height = 1;
}

message TimestampByHeightResponse {
  google.protobuf.Timestamp timestamp = 1;
}

message SctFrontierRequest {
  // Whether to include a proof of inclusion for the returned anchor
  bool with_proof = 1;
}

message SctFrontierResponse {
  // The height of the frontier we are returning.
  uint64 height = 1;
  // The SCT anchor at the given height.
  crypto.tct.v1.MerkleRoot anchor = 2;
  // A blob of bytes that corresponds to the compact frontier
  // at the given height.
  bytes compact_frontier = 3;
  // A proof of existence or non-existence, if requested.
  .ibc.core.commitment.v1.MerkleProof proof = 4;
}

message NullifierRequest {
  Nullifier nullifier = 1;
  bool with_proof = 2;
}

message NullifierResponse {
  bool spent = 1;
  NullifierWindow window = 2;
  repeated NullifierTreeLookup active_lookups = 3;
}

// Lookup result against one active nullifier tree.
message NullifierTreeLookup {
  NullifierTreeId tree = 1;
  bytes root = 2;
  bool spent = 3;
  // Present only when NullifierRequest.with_proof = true.
  IndexedNullifierWitness proof = 4;
}

message NullifierWindowRequest {}

message NullifierWindowResponse {
  NullifierWindow window = 1;
}

// Retained archive lookup used to construct a generation proof locally.
message ArchivedNullifierProofRequest {
  uint64 generation_index = 1;
  Nullifier nullifier = 2;
}

message IndexedNullifierLeaf {
  bytes value = 1;
  uint64 next_index = 2;
  bytes next_value = 3;
  bool is_lower_sentinel = 4;
  bool is_terminal = 5;
}

message IndexedNullifierPathLayer {
  // The three siblings in left-to-right order with the path child omitted.
  repeated bytes siblings = 1;
}

message IndexedNullifierWitness {
  uint64 leaf_position = 1;
  IndexedNullifierLeaf leaf = 2;
  // Exactly 20 bottom-to-root quaternary layers.
  repeated IndexedNullifierPathLayer auth_path = 3;
}

message ArchivedNullifierProofResponse {
  uint32 protocol_version = 1;
  uint64 generation_index = 2;
  bytes generation_root = 3;
  uint64 generation_start_position = 4;
  uint64 generation_end_position = 5;
  IndexedNullifierWitness witness = 6;
}

// Query operations for the SCT component.
service QueryService {
  rpc AnchorByHeight(AnchorByHeightRequest) returns (AnchorByHeightResponse);
  rpc EpochByHeight(EpochByHeightRequest) returns (EpochByHeightResponse);
  rpc TimestampByHeight(TimestampByHeightRequest) returns (TimestampByHeightResponse);
  rpc SctFrontier(SctFrontierRequest) returns (SctFrontierResponse);
  rpc Nullifier(NullifierRequest) returns (NullifierResponse);
  rpc NullifierWindow(NullifierWindowRequest) returns (NullifierWindowResponse);
  rpc ArchivedNullifierProof(ArchivedNullifierProofRequest) returns (ArchivedNullifierProofResponse);
}
