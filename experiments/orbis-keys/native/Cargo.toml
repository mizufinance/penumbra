[package]
name = "orbis-key-experiments"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
ic-vetkeys = "=0.9.0"
ic_bls12_381 = { version = "=0.10.1", features = ["experimental"] }
sha2 = "0.10"
sha3 = "0.10"
hmac = "0.12"
serde_json = "1"
rand = "0.8"
decaf377 = "0.10"
ark-ff = "0.4"
orbis-crypto = { package = "crypto", git = "https://github.com/sourcenetwork/orbis-rs", rev = "0d30611ba0f85ed0c1b17267277069cd7acef16e", default-features = false, features = ["decaf377"] }

[profile.release]
debug = false
