name: orbis-integration
on:
  pull_request:
  workflow_dispatch:
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Orbis/Vera Contract
    runs-on: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 'blacksmith-16vcpu-ubuntu-2404' || 'ubuntu-24.04' }}
    timeout-minutes: 45
    steps:
      - name: Checkout Shieldd
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: shieldd

      - name: Set up Nix and Rust
        uses: ./shieldd/.github/actions/setup-nix-rust
        with:
          free-disk: "true"
          nix-cache-glob: "shieldd/**/*.nix"
          rust-workspaces: "shieldd"

      - name: Test Orbis/Vera integration contracts
        working-directory: shieldd
        run: |
          nix develop --command cargo test --locked \
            -p shieldd-orbis-client \
            -p orbis-audit \
            -p orbis-integration
          nix develop --command cargo test --locked \
            -p shieldd-sdk-compliance \
          --features poc-orbis

      - name: Validate pinned Orbis/Vera runtime
        working-directory: shieldd
        run: |
          nix develop --command bash -euo pipefail -c '
            source scripts/lib/common.sh
            ensure_orbis_images
            run_orbis_compose deployments/orbis/docker-compose.yml \
              config >/dev/null
          '

      - name: Smoke test pinned Orbis/Vera runtime
        working-directory: shieldd
        run: |
          nix develop --command cargo build --release --locked -p orbis-integration
          nix develop --command ./scripts/orbis-stack.sh up
          nix develop --command just orbis-integration-setup-ring /tmp/orbis-state.json

      - name: Stop Orbis/Vera runtime
        if: always()
        working-directory: shieldd
        run: nix develop --command ./scripts/orbis-stack.sh down
