name: docs-lint
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  # Also support ad-hoc calls for workflow.
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rustdocs:
    # We use a custom script to generate the rustdoc index page,
    # and refactors to rust deps can break that generation. Let's ensure this script exits 0
    # on PRs, but we'll still only deploy after merge into main.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check compliance documentation links and terminology
        run: python3 scripts/check_compliance_docs.py

      - uses: ./.github/actions/setup-nix-rust

      - name: Test rustdoc package selection
        run: python3 deployments/scripts/tests/test_rust_doc_packages.py

      # Building with warm cache takes ~40s, depending on changes.
      - name: Build rustdocs
        # jemalloc's configure probes use -Werror, while Nix's fortify headers
        # reject the dev profile's default -O0 C flags.
        env:
          CFLAGS: -O1
        run: nix develop .#nightly --command ./deployments/scripts/rust-docs
