name: protobuf
on:
  # Run against all PRs, regardless of feature branch target.
  pull_request:
  merge_group:
    types: [checks_requested]
  # Also support ad-hoc calls for workflow.
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout the source code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          buf_api_token: ${{ secrets.BUF_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # Ensure the protocol specs lint cleanly and the buf module lockfile is current.
      - uses: bufbuild/buf-lint-action@06f9dd823d873146471cfaaf108a993fe00e5325 # v1
        with:
          input: "proto"
          buf_token: ${{ secrets.BUF_TOKEN }}

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: tools/proto-compiler/go.mod
          cache-dependency-path: tools/proto-compiler/go.sum

      - name: Install just
        run: cargo install just --version 1.43.1 --locked

      - name: Install protobuf compiler
        shell: bash
        run: |
          PROTOC_VERSION="$(python3 -c 'import json; print(json.load(open("proto/codegen.json"))["protoc_version"])')"
          cd /tmp
          curl -sSfL -O https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip
          unzip protoc-${PROTOC_VERSION}-linux-x86_64.zip -d $HOME/.local

      - name: Check deterministic Rust and Go generation
        run: just proto-check
