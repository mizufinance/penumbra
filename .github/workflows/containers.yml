---
name: containers
on:
  push:
    branches:
      - main
      - dev
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'
  workflow_call:
  workflow_dispatch:

concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: mizufinance/shieldd

jobs:
  build:
    name: Build and Push ${{ matrix.arch }} Image
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deployments/containerfiles/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}-${{ matrix.arch }}
          platforms: linux/${{ matrix.arch }}
          provenance: false
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max

  create_manifest:
    name: Create and Push Multi-Arch Manifest
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        shell: bash
        run: |
          set -euo pipefail
          image="${REGISTRY}/${IMAGE_NAME}"
          tags=(--tag "${image}:sha-${GITHUB_SHA}")
          alias=""
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            alias="${version//[^a-zA-Z0-9_.-]/-}"
            [[ -n "$alias" ]] || {
              echo "release tag does not contain an OCI-safe name" >&2
              exit 1
            }
          elif [[ "$GITHUB_REF_NAME" == "main" ]]; then
            alias="latest"
          elif [[ "$GITHUB_REF_NAME" == "dev" ]]; then
            alias="dev"
          fi
          if [[ -n "$alias" ]]; then
            tags+=(--tag "${image}:${alias}")
          fi
          docker buildx imagetools create \
            "${tags[@]}" \
            "$image:sha-${GITHUB_SHA}-amd64" \
            "$image:sha-${GITHUB_SHA}-arm64"
