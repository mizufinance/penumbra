[package]
name = "shieldd-sdk-view"
version = {workspace = true}
authors = {workspace = true}
edition = {workspace = true}
description = "The view RPC library for the Shieldd Zone"
repository = {workspace = true}
license = {workspace = true}
publish = true

[features]
default = ["std"]
std = []

[dependencies]
anyhow = {workspace = true}
async-trait = {workspace = true}
bytes = {workspace = true, features = ["serde"]}
camino = {workspace = true}
decaf377 = {workspace = true, default-features = true}
digest = "0.9"
genawaiter = "0.99"
hex = {workspace = true}
ibc-types = {workspace = true, default-features = false}
once_cell = {workspace = true}
shieldd-sdk-app = {workspace = true, default-features = false}
shieldd-sdk-asset = {workspace = true, default-features = true}
shieldd-sdk-compact-block = {workspace = true, default-features = false}
shieldd-sdk-compliance = {workspace = true, default-features = false}
shieldd-sdk-fee = {workspace = true, default-features = false}
shieldd-sdk-ibc = {workspace = true, default-features = false}
shieldd-sdk-keys = {workspace = true, default-features = true}
shieldd-sdk-num = {workspace = true, default-features = true}
shieldd-sdk-proof-params = {workspace = true, default-features = false}
shieldd-sdk-proto = {workspace = true, features = ["rpc"], default-features = true}
shieldd-sdk-sct = {workspace = true, default-features = false}
shieldd-sdk-shielded-pool = {workspace = true, default-features = false}
shieldd-sdk-tct = {workspace = true, default-features = true}
shieldd-sdk-transaction = {workspace = true, default-features = true}
r2d2 = {workspace = true}
r2d2_sqlite = {workspace = true, features = ["bundled"]}
rand = {workspace = true}
rand_core = {workspace = true, features = ["getrandom"]}
serde = {workspace = true, features = ["derive"]}
serde_json = {workspace = true}
sha2 = {workspace = true}
tokio = {workspace = true, features = ["full"]}
tonic = {workspace = true, features = ["tls", "tls-webpki-roots"]}
tracing = {workspace = true}

[dev-dependencies]
pbjson-types = { workspace = true }
shieldd-sdk-shielded-pool = {workspace = true, default-features = false, features = ["benchmark-helpers"]}
shieldd-sdk-compliance = {workspace = true, default-features = false, features = ["test-helpers"]}
shieldd-sdk-keys = {workspace = true, features = ["demo"]}
tempfile = {workspace = true}
