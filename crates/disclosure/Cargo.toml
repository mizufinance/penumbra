[package]
name = "shieldd-sdk-disclosure"
version = "2.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[features]
default = []
proof = ["dep:risc0-zkvm", "dep:shieldd-disclosure-methods"]
prover = ["proof", "risc0-zkvm/client"]

[dependencies]
base64 = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
rand_core = { workspace = true }
decaf377 = { workspace = true }
decaf377-ka = { workspace = true }
decaf377-rdsa = { workspace = true }
shieldd-sdk-keys = { workspace = true }
shieldd-sdk-asset = { workspace = true }
shieldd-sdk-shielded-pool = { workspace = true }
shieldd-sdk-transaction = { workspace = true, default-features = false }
shieldd-sdk-proto = { workspace = true }
risc0-zkvm = { version = "=3.0.6", default-features = false, features = ["std", "disable-dev-mode"], optional = true }
shieldd-disclosure-methods = { path = "../disclosure-methods", optional = true }

[dev-dependencies]
rand = { workspace = true }
