[package]
name = "orbis-audit"
version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }
description = "Orbis-only compliance audit POC for Shieldd transfer tiers"
repository = { workspace = true }
license = { workspace = true }
publish = false

[dependencies]
anyhow = { workspace = true }
bech32 = { workspace = true }
clap = { workspace = true, features = ["derive"] }
decaf377 = { workspace = true, default-features = true }
hex = { workspace = true }
orbis-authn = { package = "authn", git = "https://github.com/sourcenetwork/orbis-rs", rev = "1249ba8bf14c05a4b8086f239623ce98206076ea" }
orbis-common = { package = "common", git = "https://github.com/sourcenetwork/orbis-rs", rev = "1249ba8bf14c05a4b8086f239623ce98206076ea" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
shieldd-orbis-client = { workspace = true }
shieldd-sdk-compliance = { workspace = true, default-features = false, features = ["poc-orbis"] }
shieldd-sdk-keys = { workspace = true, default-features = true }
shieldd-sdk-shielded-pool = { workspace = true, default-features = true }
tokio = { workspace = true, features = ["full"] }
