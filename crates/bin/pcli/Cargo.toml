[package]
name = "pcli"
version = {workspace = true}
authors = {workspace = true}
edition = {workspace = true}
description = "Offline wallet, key, grant, and custody tooling"
repository = {workspace = true}
license = {workspace = true}
publish = false

[features]
default = ["demo", "disclosure"]
disclosure = ["dep:shieldd-sdk-disclosure", "dep:shieldd-sdk-view", "dep:tonic", "dep:tempfile", "dep:libc"]
development-disclosure-artifacts = ["disclosure", "shieldd-sdk-disclosure/development-artifacts"]
disclosure-prover = ["disclosure", "shieldd-sdk-disclosure/prover"]
demo = ["shieldd-sdk-keys/demo"]
ledger = ["dep:shieldd-sdk-custody-ledger-usb"]

[dependencies]
shieldd-sdk-disclosure = { workspace = true, features = ["proof"], optional = true }
shieldd-sdk-view = { workspace = true, optional = true }
tonic = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
libc = { version = "0.2", optional = true }
async-trait = {workspace = true}
anyhow = {workspace = true}
base64 = {workspace = true}
bytes = {workspace = true}
camino = {workspace = true}
clap = {workspace = true, features = ["derive", "env"]}
decaf377 = {workspace = true, default-features = true}
decaf377-rdsa = {workspace = true}
time = "0.3"
directories = {workspace = true}
hex = {workspace = true}
shieldd-sdk-asset = {workspace = true, default-features = false}
shieldd-sdk-compliance = {workspace = true, default-features = false}
shieldd-sdk-custody = {workspace = true}
shieldd-sdk-custody-ledger-usb = {workspace = true, optional = true}
shieldd-sdk-keys = {workspace = true, default-features = false}
shieldd-sdk-proto = {workspace = true, default-features = true}
shieldd-sdk-transaction = {workspace = true, default-features = false}
rand = {workspace = true}
rand_core = {workspace = true, features = ["getrandom"]}
rpassword = {workspace = true}
serde = {workspace = true, features = ["derive"]}
serde_json = {workspace = true}
serde_with = {workspace = true, features = ["hex"]}
tokio = {workspace = true, features = ["macros", "rt-multi-thread", "process", "io-util", "signal", "time"]}
toml = {workspace = true, features = ["preserve_order"]}
termion = {workspace = true}
tracing = {workspace = true}
tracing-subscriber = {workspace = true, features = ["env-filter", "ansi"]}

[dev-dependencies]
assert_cmd = {workspace = true}
predicates = "2.1"
