[package]
name = "bankd-e2e-spend-builder"
version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }
description = "Builds a Shieldd spend transaction for Bankd e2e tests"
repository = { workspace = true }
license = { workspace = true }
publish = false

[features]
default = ["bundled-proving-keys"]
bundled-proving-keys = [
    "shieldd-sdk-proof-params/bundled-proving-keys",
    "shieldd-sdk-shielded-pool/bundled-proving-keys",
]
[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
cnidarium = { workspace = true, features = ["migration", "rpc"], default-features = true }
decaf377 = { workspace = true, default-features = true }
decaf377-rdsa = { workspace = true }
hex = { workspace = true }
rand_core = { workspace = true }
shieldd-sdk-app = { workspace = true, features = ["parallel"], default-features = true }
shieldd-sdk-asset = { workspace = true, default-features = true }
shieldd-sdk-compliance = { workspace = true, default-features = true, features = ["poc-orbis"] }
shieldd-sdk-keys = { workspace = true, default-features = true }
shieldd-sdk-mock-client = { workspace = true }
shieldd-sdk-num = { workspace = true, default-features = true }
shieldd-sdk-proof-params = { workspace = true, default-features = true }
shieldd-sdk-proto = { workspace = true, default-features = true }
shieldd-sdk-shielded-pool = { workspace = true, features = ["component", "poc-orbis"], default-features = true }
shieldd-sdk-transaction = { workspace = true, features = ["parallel"], default-features = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
