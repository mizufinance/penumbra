[package]
name = "shieldd-sdk-bench"
authors = {workspace = true}
repository = {workspace = true}
description = "Benchmarks for Shieldd crates"
version = {workspace = true}
license = {workspace = true}
edition = {workspace = true}
publish = false

[features]
parallel = [
    "ark-ff/parallel",
    "decaf377/parallel",
    "ark-groth16/parallel",
    "ark-std/parallel",
    "ark-r1cs-std/parallel",
]

# --- Vanilla benchmarks ---

[[bench]]
name = "decaf377"
path = "benches/vanilla/decaf377.rs"
harness = false

[[bench]]
name = "arkworks"
path = "benches/vanilla/arkworks.rs"
harness = false

[[bench]]
name = "bls_threshold"
path = "benches/vanilla/bls_threshold.rs"
harness = false

[[bench]]
name = "snarkpack_prepared_g2"
path = "benches/vanilla/snarkpack_prepared_g2.rs"
harness = false

[[bench]]
name = "nullifier_storage"
path = "benches/state/nullifier_storage.rs"
harness = false


[dependencies]
anyhow = {workspace = true}
bytes = {workspace = true}
clap = {workspace = true, features = ["derive"]}
shieldd-sdk-bench-support = { path = "../bench-support" }
ark-bls12-377 = { workspace = true }
ark-bw6-761 = { workspace = true }
ark-ec = {workspace = true}
ark-ff = {workspace = true, default-features = false}
ark-groth16 = {workspace = true, default-features = false}
ark-r1cs-std = {workspace = true, default-features = false}
ark-relations = {workspace = true}
ark-serialize = {workspace = true}
ark-snark = {workspace = true}
ark-std = {workspace = true, default-features = false}
cnidarium = {workspace = true, features = ["migration"], default-features = true}
decaf377 = {workspace = true, features = ["r1cs"], default-features = true}
shieldd-sdk-app = {workspace = true, features = ["benchmark-helpers"], default-features = true}
shieldd-sdk-proof-params = { workspace = true, default-features = true, features = ["bundled-proving-keys"] }
shieldd-sdk-proof-aggregation = {workspace = true}
shieldd-sdk-sct = {workspace = true, default-features = true}
rand = {workspace = true}
rand_core = {workspace = true, features = ["getrandom"]}
serde = {workspace = true, features = ["derive"]}
serde_json = {workspace = true}
tokio = {workspace = true, features = ["rt-multi-thread", "macros", "time", "sync"]}

[dev-dependencies]
anyhow = {workspace = true}
criterion = {workspace = true, features = ["html_reports"]}
decaf377-ka = {workspace = true}
rand_chacha = {workspace = true}
tempfile = {workspace = true}
