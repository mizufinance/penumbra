[package]
name = "shieldd-sdk-transaction"
authors = {workspace = true}
repository = {workspace = true}
description = "Core transaction data structures for Shieldd"
version = {workspace = true}
license = {workspace = true}
edition = {workspace = true}

[features]
default = ["std", "parallel"]
std = ["ark-ff/std", "ibc-types/std"]
parallel = [
    "tokio",
    "shieldd-sdk-shielded-pool/parallel",
]
[dependencies]
anyhow = {workspace = true}
ark-ff = {workspace = true, default-features = false}
blake2b_simd = {workspace = true}
bytes = {workspace = true}
decaf377 = {workspace = true}
decaf377-ka = {workspace = true}
decaf377-rdsa = {workspace = true}
hex = {workspace = true}
ibc-proto = {workspace = true, default-features = false}
ibc-types = {workspace = true, default-features = false}
pbjson-types = {workspace = true}
shieldd-sdk-asset = {workspace = true, default-features = false}
shieldd-sdk-compliance = {workspace = true, default-features = false}
shieldd-sdk-fee = {workspace = true, default-features = false}
shieldd-sdk-ibc = {workspace = true, default-features = false}
shieldd-sdk-keys = {workspace = true, default-features = false}
shieldd-sdk-num = {workspace = true, default-features = false}
shieldd-sdk-proof-aggregation = {workspace = true, default-features = true}
shieldd-sdk-proto = {workspace = true, default-features = true}
shieldd-sdk-sct = {workspace = true, default-features = false}
shieldd-sdk-shielded-pool = {workspace = true, default-features = false}
shieldd-sdk-tct = {workspace = true, default-features = true }
shieldd-sdk-txhash = {workspace = true, default-features = false}
rand = {workspace = true}
rand_core = {workspace = true, features = ["getrandom"]}
serde = {workspace = true, features = ["derive"]}
serde_json = {workspace = true}
sha2 = {workspace = true}
thiserror = {workspace = true}
tokio = {workspace = true, features = ["full"], optional = true}
tracing = {workspace = true}

[dev-dependencies]
ark-groth16 = { workspace = true }
ark-serialize = { workspace = true }
shieldd-sdk-shielded-pool = { workspace = true, default-features = false, features = ["benchmark-helpers"] }
proptest = {workspace = true}
serde_json = {workspace = true}
shieldd-sdk-tct = {workspace = true, default-features = true, features = ["arbitrary"] }
