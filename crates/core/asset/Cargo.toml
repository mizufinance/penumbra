[package]
name = "shieldd-sdk-asset"
authors = {workspace = true}
repository = {workspace = true}
description = "Core asset data structures for Shieldd"
version = {workspace = true}
license = {workspace = true}
edition = {workspace = true}

[features]
default = []
parallel = [
    "ark-ff/parallel",
    "poseidon377/parallel",
    "decaf377-rdsa/parallel",
    "decaf377/parallel",
]

[dependencies]
anyhow = {workspace = true}
ark-ff = {workspace = true, default-features = false}
ark-serialize = {workspace = true}
base64 = {workspace = true}
bech32 = {workspace = true}
blake2b_simd = {workspace = true}
bytes = {workspace = true}
decaf377 = {workspace = true, default-features = true}
decaf377-rdsa = {workspace = true}
derivative = {workspace = true}
getrandom = {workspace = true, features = ["js"]}
hex = {workspace = true}
once_cell = {workspace = true}
shieldd-sdk-num = {workspace = true, default-features = true}
shieldd-sdk-proto = {workspace = true, default-features = true}
poseidon377 = {workspace = true}
rand = {workspace = true}
rand_core = {workspace = true, features = ["getrandom"]}
regex = {workspace = true}
serde = {workspace = true, features = ["derive"]}
serde_with = {workspace = true}
sha2 = {workspace = true}
thiserror = {workspace = true}
tracing = {workspace = true}
pbjson-types = {workspace = true}
lazy_static = "1.5.0"

[dev-dependencies]
proptest = {workspace = true}
serde_json = {workspace = true}
getrandom = {workspace = true}
