[package]
name = "shieldd-sdk-sct"
authors = {workspace = true}
repository = {workspace = true}
description = "SCT component implementation for Shieldd"
version = {workspace = true}
license = {workspace = true}
edition = {workspace = true}

[features]
component = [
    "cnidarium",
    "cnidarium-component",
    "shieldd-sdk-proto/cnidarium",
    "tokio",
]
default = ["std", "component"]
std = ["ark-ff/std"]
docsrs = []
parallel = ["shieldd-sdk-tct/parallel", "dep:rayon"]

[dependencies]
anyhow = {workspace = true}
ark-ff = {workspace = true, default-features = false}
ark-serialize = {workspace = true}
async-trait = {workspace = true}
bincode = {workspace = true}
blake2b_simd = {workspace = true}
bytes = {workspace = true}
cnidarium = {workspace = true, optional = true, default-features = true}
cnidarium-component = {workspace = true, optional = true, default-features = true}
decaf377 = {workspace = true, default-features = true}
decaf377-rdsa = {workspace = true}
hex = {workspace = true}
futures = {workspace = true}
imbl = {workspace = true}
metrics = {workspace = true}
once_cell = {workspace = true}
pbjson-types = {workspace = true}
shieldd-sdk-keys = {workspace = true, default-features = false}
shieldd-sdk-proto = {workspace = true, default-features = false}
shieldd-sdk-tct = {workspace = true, default-features = true}
shieldd-sdk-txhash = {workspace = true, default-features = false}
poseidon377 = {workspace = true}
rand = {workspace = true}
rand_core = {workspace = true, features = ["getrandom"]}
rayon = { version = "1.10", optional = true }
serde = {workspace = true, features = ["derive"]}
serde_json = {workspace = true}
sha2 = {workspace = true}
tendermint = {workspace = true}
tokio = {workspace = true, optional = true, features = ["rt"]}
tracing = {workspace = true}
chrono = { workspace = true, default-features = false, features = ["serde", "now"] }

[dev-dependencies]
getrandom = {workspace = true}
tempfile = {workspace = true}
tokio = {workspace = true, features = ["full"]}
