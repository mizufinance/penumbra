[package]
name = "shieldd-sdk-shielded-pool"
authors = {workspace = true}
repository = {workspace = true}
description = "Multi-asset shielded pool implementation for Shieldd"
version = {workspace = true}
license = {workspace = true}
edition = {workspace = true}

[features]
component = [
    "cnidarium-component",
    "cnidarium",
    "shieldd-sdk-compliance/component",
    "shieldd-sdk-proto/cnidarium",
    "shieldd-sdk-ibc/component",
    "shieldd-sdk-sct/component",
    "tonic",
    "ibc-proto/server",
    "ibc-proto/transport",
]
# proving-keys = ["shieldd-sdk-proof-params/proving-keys"]
default = ["std", "component"]
std = ["ark-ff/std"]
bundled-proving-keys = ["shieldd-sdk-proof-params/bundled-proving-keys"]
parallel = [
    "shieldd-sdk-tct/parallel",
    "ark-ff/parallel",
    "poseidon377/parallel",
    "decaf377-rdsa/parallel",
    "ark-groth16/parallel",
    "decaf377/parallel",
    "tonic",
]
docsrs = []
benchmark-helpers = ["component", "shieldd-sdk-ibc/benchmark-helpers"]
poc-orbis-v0 = ["shieldd-sdk-compliance/poc-orbis-v0"]

[dependencies]
anyhow = {workspace = true}
ark-ec = {workspace = true, default-features = false}
ark-ff = {workspace = true, default-features = false}
ark-groth16 = {workspace = true, default-features = false}
ark-serialize = {workspace = true}
ark-snark = {workspace = true}
async-stream = {workspace = true}
async-trait = {workspace = true}
base64 = {workspace = true}
blake2b_simd = {workspace = true}
bytes = {workspace = true}
chacha20poly1305 = {workspace = true}
cnidarium = {workspace = true, optional = true, default-features = true}
cnidarium-component = {workspace = true, optional = true, default-features = true}
decaf377 = {workspace = true, default-features = true}
decaf377-ka = {workspace = true}
decaf377-rdsa = {workspace = true}
futures = {workspace = true}
hex = {workspace = true}
ibc-proto = {workspace = true, default-features = false}
ibc-types = {workspace = true, features = ["with_serde"], default-features = false}
imbl = {workspace = true}
jmt = {workspace = true}
libloading = {workspace = true}
metrics = {workspace = true}
once_cell = {workspace = true}
shieldd-sdk-asset = {workspace = true, default-features = false}
shieldd-sdk-compliance = {workspace = true, default-features = false}
shieldd-sdk-ibc = {workspace = true, default-features = false}
shieldd-sdk-keys = {workspace = true, default-features = false}
shieldd-sdk-num = {workspace = true, default-features = false}
shieldd-sdk-proof-params = {workspace = true, default-features = false}
shieldd-sdk-proto = {workspace = true, default-features = false}
shieldd-sdk-sct = {workspace = true, default-features = false}
shieldd-sdk-tct = {workspace = true, default-features = true}
shieldd-sdk-txhash = {workspace = true, default-features = false}
poseidon377 = {workspace = true}
prost = {workspace = true}
rand = {workspace = true}
rand_core = {workspace = true, features = ["getrandom"]}
regex = {workspace = true}
serde = {workspace = true, features = ["derive"]}
serde_json = {workspace = true}
sha2 = {workspace = true}
tap = {workspace = true}
tendermint = {workspace = true}
thiserror = {workspace = true}
tonic = {workspace = true, optional = true}
tracing = {workspace = true}

[dev-dependencies]
decaf377 = {workspace = true, features = ["r1cs"]}
poseidon377 = {workspace = true, features = ["r1cs"]}
ark-r1cs-std = {workspace = true}
ark-relations = {workspace = true}
criterion = {workspace = true}
shieldd-sdk-compliance = {workspace = true, default-features = false, features = ["test-helpers"]}
shieldd-sdk-proof-params = {workspace = true, default-features = false}
proptest = {workspace = true}
tokio = {workspace = true, features = ["rt-multi-thread", "macros"]}

[[bench]]
name = "routing"
harness = false
