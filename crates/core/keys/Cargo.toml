[package]
name = "shieldd-sdk-keys"
authors = {workspace = true}
repository = {workspace = true}
description = "Key data structures and core utilities for Shieldd"
version = {workspace = true}
license = {workspace = true}
edition = {workspace = true}

[features]
default = []
parallel = ["shieldd-sdk-tct/parallel", "ark-ff/parallel", "poseidon377/parallel", "decaf377-rdsa/parallel", "decaf377/parallel"]
# Enables demo/test-only code like UserComplianceKey::demo()
demo = []

[dependencies]
aes = "0.8.1"
anyhow = {workspace = true}
ark-ff = {workspace = true, default-features = false}
ark-serialize = {workspace = true}
base64 = {workspace = true}
bech32 = {workspace = true}
bip32 = "0.5"
blake2b_simd = {workspace = true}
bytes = {workspace = true}
chacha20poly1305 = {workspace = true}
decaf377 = {workspace = true, default-features = true}
decaf377-ka = {workspace = true}
decaf377-rdsa = {workspace = true}
derivative = {workspace = true}
f4jumble = "0.1.0"
hex = {workspace = true}
hmac = "0.12.0"
once_cell = {workspace = true}
pbkdf2 = "0.12.0"
shieldd-sdk-asset = {workspace = true, default-features = true}
shieldd-sdk-proto = {workspace = true, default-features = true}
shieldd-sdk-tct = {workspace = true, default-features = true}
poseidon377 = {workspace = true}
rand = {workspace = true}
rand_core = {workspace = true, features = ["getrandom"]}
regex = {workspace = true}
serde = {workspace = true, features = ["derive"]}
sha2 = {workspace = true}
thiserror = {workspace = true}
tracing = {workspace = true}

[dev-dependencies]
proptest = {workspace = true}
serde_json = {workspace = true}
num-traits = {workspace = true}
getrandom = {workspace = true}
