[package]
name        = "shieldd-sdk-app"
version     = { workspace = true }
authors     = { workspace = true }
edition     = { workspace = true}
repository  = { workspace = true }
license     = { workspace = true }
description = "A stack of components implementing the Shieldd protocol"
publish     = true

[features]
component = [
  "dep:cnidarium",
  "dep:cnidarium-component",
  "shieldd-sdk-proto/cnidarium",
  "shieldd-sdk-compact-block/component",
  "shieldd-sdk-compliance/component",
  "shieldd-sdk-fee/component",
  "shieldd-sdk-ibc/component",
  "shieldd-sdk-sct/component",
  "shieldd-sdk-shielded-pool/component",
]
parallel = [
  "ark-ff/parallel",
  "shieldd-sdk-proof-params/parallel",
  "shieldd-sdk-sct/parallel",
]
benchmark-helpers = [
  "shieldd-sdk-ibc/benchmark-helpers",
  "shieldd-sdk-shielded-pool/benchmark-helpers",
]
default = ["std", "component"]
fuzzing = []
# Insecure isolated integration only; never enable in production.
orbis-dev-srs = []
std     = ["ark-ff/std", "ibc-types/std"]

[dependencies]
anyhow                           = { workspace = true }
ark-ff                           = { workspace = true, default-features = false }
ark-groth16                      = { workspace = true, default-features = false }
ark-serialize                    = { workspace = true }
async-trait                      = { workspace = true }
bincode                          = { workspace = true }
cfg-if                           = "1.0"
cnidarium                        = { workspace = true, optional = true, features = ["migration", "rpc"], default-features = true }
cnidarium-component              = { workspace = true, optional = true, default-features = true }
decaf377                         = { workspace = true, default-features = true }
decaf377-rdsa                    = { workspace = true }
futures                          = { workspace = true }
hex                              = { workspace = true }
ibc-types                        = { workspace = true, default-features = false }
jmt                              = { workspace = true }
metrics                          = { workspace = true }
once_cell                        = { workspace = true }
parking_lot                      = { workspace = true }
shieldd-sdk-asset                   = { workspace = true, default-features = true }
shieldd-sdk-compact-block           = { workspace = true, default-features = false }
shieldd-sdk-compliance              = { workspace = true, default-features = false }
shieldd-sdk-fee                     = { workspace = true, default-features = false }
shieldd-sdk-ibc                     = { workspace = true, default-features = false }
shieldd-sdk-keys                    = { workspace = true, default-features = true }
shieldd-sdk-num                     = { workspace = true, default-features = true }
shieldd-sdk-proof-params            = { workspace = true, default-features = false }
shieldd-sdk-proof-aggregation       = { workspace = true, default-features = true }
shieldd-sdk-proto                   = { workspace = true, default-features = true }
shieldd-sdk-sct                     = { workspace = true, default-features = false }
shieldd-sdk-shielded-pool           = { workspace = true, default-features = false }
shieldd-sdk-tct                     = { workspace = true, default-features = true }
shieldd-sdk-transaction             = { workspace = true, features = ["parallel"], default-features = true }
shieldd-sdk-txhash                  = { workspace = true, default-features = true }
prost                            = { workspace = true }
serde                            = { workspace = true, features = ["derive"] }
serde_json                       = { workspace = true }
sha2                             = { workspace = true }
tempfile                         = { workspace = true }
tendermint                       = { workspace = true }
tokio                            = { workspace = true, features = ["full", "tracing"] }
tower                            = { workspace = true, features = ["full"] }
tracing                          = { workspace = true }

[dev-dependencies]
shieldd-sdk-compliance           = { workspace = true, features = ["test-helpers"] }
shieldd-sdk-mock-client         = { workspace = true }
shieldd-sdk-proto               = { workspace = true, features = ["box-grpc"] }
shieldd-sdk-shielded-pool       = { workspace = true, default-features = false, features = ["benchmark-helpers"] }
proptest                         = { workspace = true }
rand                             = { workspace = true }
rand_core                        = { workspace = true }
tempfile                         = { workspace = true }

[dev-dependencies.shieldd-sdk-proof-params]
workspace = true
