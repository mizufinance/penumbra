[package]
name = "shieldd-sdk-custody"
authors = {workspace = true}
repository = {workspace = true}
description = "Modular custody for Shieldd"
version = {workspace = true}
license = {workspace = true}
edition = {workspace = true}

[dependencies]
anyhow = {workspace = true}
argon2 = "0.5"
ark-serialize = {workspace = true}
base64 = {workspace = true}
blake2b_simd = {workspace = true}
bytes = {workspace = true, features = ["serde"]}
chacha20poly1305 = {workspace = true}
decaf377 = {workspace = true}
decaf377-frost = { version = "2.1.0", path = "../crypto/decaf377-frost" }
decaf377-ka = {workspace = true}
ed25519-consensus = {workspace = true}
hex = {workspace = true}
shieldd-sdk-keys = {workspace = true, default-features = true}
shieldd-sdk-proto = {workspace = true, features = ["rpc"], default-features = true}
shieldd-sdk-transaction = {workspace = true, default-features = true}
shieldd-sdk-txhash = {workspace = true, default-features = true}
rand_core = {workspace = true}
serde = {workspace = true, features = ["derive"]}
serde_json = {workspace = true}
serde_with = {workspace = true, features = ["hex"]}
tokio = {workspace = true, features = ["full"]}
tonic = {workspace = true}
tracing = {workspace = true}

[dev-dependencies]
pbjson-types = { workspace = true }
shieldd-sdk-asset = { workspace = true, default-features = true }
shieldd-sdk-sct = { workspace = true, default-features = false }
shieldd-sdk-shielded-pool = { workspace = true, default-features = false, features = ["benchmark-helpers"] }
toml = {workspace = true}
