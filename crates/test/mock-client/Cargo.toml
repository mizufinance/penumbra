[package]
name = "shieldd-sdk-mock-client"
authors = {workspace = true}
repository = {workspace = true}
description = "Mock a client to build end-to-end tests"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
anyhow = {workspace = true}
cnidarium = {workspace = true, default-features = true}
decaf377 = {workspace = true, default-features = true}
shieldd-sdk-asset = {workspace = true}
shieldd-sdk-compact-block = {workspace = true, default-features = true}
shieldd-sdk-compliance = {workspace = true, features = ["component"], default-features = true}
shieldd-sdk-keys = {workspace = true, default-features = true}
shieldd-sdk-sct = {workspace = true, default-features = true}
shieldd-sdk-shielded-pool = {workspace = true, features = [
    "bundled-proving-keys",
    "component",
], default-features = true}
shieldd-sdk-tct = {workspace = true, default-features = true}
shieldd-sdk-transaction = {workspace = true, default-features = true, features = ["prover"]}
shieldd-sdk-view = {workspace = true, default-features = true}
rand_core = {workspace = true}

[dev-dependencies]
shieldd-sdk-shielded-pool = {workspace = true, features = ["benchmark-helpers"]}
