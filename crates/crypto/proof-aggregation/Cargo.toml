[package]
name = "shieldd-sdk-proof-aggregation"
authors = { workspace = true }
repository = { workspace = true }
description = "Proof aggregation primitives for Shieldd consensus"
version = { workspace = true }
license = { workspace = true }
edition = { workspace = true }

[features]
default = []
fuzzing = []
# Bench-only A/B seam (compile-time, never on in production). Forwards to the
# RIPP backend's retained pre-optimization paths. See
# optimization-playbook.md (in this crate).

[[bench]]
name = "snarkpack"
harness = false


[dependencies]
anyhow = { workspace = true }
ark-ec = { workspace = true }
ark-ff = { workspace = true }
ark-groth16 = { workspace = true, default-features = false }
ark-inner-products = { path = "src/ipp/inner_products" }
ark-serialize = { workspace = true }
ark-ip-proofs = { path = "src/ipp/ip_proofs" }
bincode = { workspace = true }
blake2 = "0.9"
decaf377 = { workspace = true }
digest = "0.9"
hex = { workspace = true }
shieldd-sdk-proof-params = { workspace = true, default-features = false }
shieldd-sdk-proto = { workspace = true, default-features = true }
shieldd-sdk-shielded-pool = { workspace = true, default-features = false }
rand = { workspace = true }
rand_chacha = { workspace = true }
rayon = "1"
serde = { workspace = true, features = ["derive"] }
sha2 = { workspace = true }

[dev-dependencies]
ark-r1cs-std = { workspace = true }
ark-relations = { workspace = true }
ark-snark = { workspace = true }
criterion = { workspace = true, features = ["html_reports"] }
proptest = { workspace = true }
