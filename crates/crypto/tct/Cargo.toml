[package]
name = "shieldd-sdk-tct"
authors = {workspace = true}
repository = {workspace = true}
description = "The tiered commitment tree for Shieldd"
version = {workspace = true}
license = {workspace = true}
edition = {workspace = true}

[features]
internal = []
arbitrary = ["proptest", "proptest-derive"]
parallel = ["ark-ff/parallel", "decaf377/parallel", "poseidon377/parallel", "dep:rayon"]

[dependencies]
ark-ed-on-bls12-377 = { workspace = true }
ark-ff = {workspace = true, default-features = false}
ark-serialize = {workspace = true}
async-trait = {workspace = true}
blake2b_simd = {workspace = true}
decaf377 = {workspace = true, default-features = true}
derivative = {workspace = true}
futures = {workspace = true}
getrandom = {workspace = true, features = ["js"]}
hash_hasher = "2"
hex = {workspace = true}
imbl = {workspace = true, features = ["serde"]}
once_cell = {workspace = true}
parking_lot = {workspace = true}
shieldd-sdk-proto = {workspace = true, default-features = true}
poseidon377 = {workspace = true}
proptest = {workspace = true, optional = true}
proptest-derive = {workspace = true, optional = true}
rand = {workspace = true}
rayon = { version = "1.10", optional = true }
serde = {workspace = true, features = ["derive", "rc"]}
thiserror = {workspace = true}
tracing = {workspace = true}

[dev-dependencies]
static_assertions = "1"
proptest = {workspace = true}
proptest-derive = {workspace = true}
serde_json = {workspace = true}
getrandom = {workspace = true}
