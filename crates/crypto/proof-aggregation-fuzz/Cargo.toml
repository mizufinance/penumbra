[package]
name = "shieldd-sdk-proof-aggregation-fuzz"
authors = { workspace = true }
repository = { workspace = true }
description = "Coverage-guided fuzz targets for Shieldd proof aggregation"
version = { workspace = true }
license = { workspace = true }
edition = { workspace = true }
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
shieldd-sdk-proof-aggregation = { workspace = true, features = ["fuzzing"] }
shieldd-sdk-proof-aggregation-reference = { path = "../proof-aggregation-reference" }

[[bin]]
name = "deserialize_aggregate_proof"
path = "fuzz_targets/deserialize_aggregate_proof.rs"
test = false
doc = false
bench = false
