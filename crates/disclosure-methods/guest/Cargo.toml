[package]
name = "disclosure-guest"
version = "2.1.0"
edition = "2021"

[workspace]

[profile.release]
lto = "thin"
codegen-units = 1

[dependencies]
risc0-zkvm = { version = "=3.0.6", default-features = false, features = ["std"] }
shieldd-sdk-disclosure = { path = "../../disclosure", default-features = false }
serde_json = "1"
decaf377 = { version = "0.10.1", features = ["risc0"] }

[patch.crates-io]
decaf377 = { git = "https://github.com/mizufinance/decaf377", rev = "3cbab97f34d352b49bc1200dba839d37b223e66d" }
decaf377-rdsa = { git = "https://github.com/mizufinance/decaf377-rdsa", rev = "fc6045f0d9de5db8c37f57fa019e390367ba17cb" }
poseidon377 = { git = "https://github.com/mizufinance/poseidon377", branch = "main" }
poseidon-permutation = { git = "https://github.com/mizufinance/poseidon377", branch = "main" }
poseidon-parameters = { git = "https://github.com/mizufinance/poseidon377", branch = "main" }
